# v로 시작하는 태그(v1.0.0 등)를 올리면 윈도우 설치 파일과 맥 dmg를 만들어 Releases에 올려.
name: 데스크톱 앱 빌드
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs desktop
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: sticky-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          ### 받기
          - **윈도우**: \`Sticky-Setup-${GITHUB_REF_NAME#v}.exe\` 받아서 실행 (파란 경고창이 뜨면 *추가 정보 → 실행*)
          - **맥**: \`Sticky-${GITHUB_REF_NAME#v}-mac.dmg\` 열고 Sticky를 응용 프로그램으로 끌어다 놓기 (처음엔 *시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기*)
          - **아이폰**: 사파리로 https://limmmmmmn.github.io/Sticky/ 열고 *공유 → 홈 화면에 추가*
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Sticky $GITHUB_REF_NAME" --notes-file notes.md
